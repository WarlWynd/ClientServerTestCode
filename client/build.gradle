plugins {
    id 'application'
}

def gitCommit = {
    try {
        def proc = ['git', 'rev-parse', '--short', 'HEAD'].execute(null, rootDir)
        proc.waitFor()
        proc.text.trim() ?: 'unknown'
    } catch (Exception ignored) { 'unknown' }
}()

processResources {
    inputs.property('gitCommit', gitCommit)
    filesMatching('build-info.properties') {
        expand(gitCommit: gitCommit,
               buildTime: new Date().format("yyyy-MM-dd HH:mm:ss z"))
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation project(':shared')
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.2'
    implementation 'ch.qos.logback:logback-classic:1.5.8'

    // ── jMonkeyEngine 3.6.1-stable ────────────────────────────────────────────
    implementation 'org.jmonkeyengine:jme3-core:3.6.1-stable'
    implementation 'org.jmonkeyengine:jme3-desktop:3.6.1-stable'
    implementation 'org.jmonkeyengine:jme3-lwjgl3:3.6.1-stable'
    implementation 'org.jmonkeyengine:jme3-terrain:3.6.1-stable'
    implementation 'org.jmonkeyengine:jme3-effects:3.6.1-stable'
    implementation 'org.jmonkeyengine:jme3-plugins:3.6.1-stable'
    // ── Lemur GUI ────────────────────────────────────────────────────────────
    implementation 'com.simsilica:lemur:1.16.0'
    implementation 'com.simsilica:lemur-proto:1.13.0'
}

application {
    mainClass = 'com.game.client.ClientMain'
}

// Always run from the repo root so relative paths like
// "client/src/main/resources/..." resolve correctly.
tasks.named('run') {
    workingDir = rootProject.projectDir
}

jar {
    archiveBaseName = 'game-client'
    manifest {
        attributes 'Main-Class': 'com.game.client.ClientMain'
    }
    from {
        configurations.runtimeClasspath.collect {
            it.isDirectory() ? it : zipTree(it)
        }
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
