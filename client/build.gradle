plugins {
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

javafx {
    version = "23"
    modules = ['javafx.controls', 'javafx.graphics']
}

dependencies {
    implementation project(':client-core')
    runtimeOnly 'org.jmonkeyengine:jme3-desktop:3.6.1-stable'
    runtimeOnly 'org.jmonkeyengine:jme3-lwjgl3:3.6.1-stable'
}

application {
    mainClass = 'com.game.client.desktop.DesktopLauncher'
}

jar {
    archiveBaseName = 'game-client'
    manifest {
        attributes 'Main-Class': 'com.game.client.desktop.DesktopLauncher'
    }
    from {
        configurations.runtimeClasspath.collect {
            it.isDirectory() ? it : zipTree(it)
        }
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.named('run') {
    workingDir = rootProject.projectDir
}
