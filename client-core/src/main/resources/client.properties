# ─────────────────────────────────────────────
#  Game Client Configuration
# ─────────────────────────────────────────────

# Application display name
ProgramName=Adventure Friends

# Corporation name
CorpName=Wynd Farm

# Server address and UDP port
server.host=147.136.236.127
server.port=9876

# Admin commands are routed to the internal address so they cannot be sent from outside the LAN
admin.host=192.168.1.153

# External (public) server address — used by players connecting from outside the LAN
server.external.host=147.136.236.127
server.external.port=9876

# Server-side access control flags
admin.allowExternalAdmin=false
admin.allowExternalDev=false

# Asset HTTP port (used for pre-login client file sync)
server.asset.port=9877

# Local UDP port (0 = OS-assigned ephemeral port)
client.port=0

# Asset/HTTP server base URL
asset.url=http://147.136.236.127:9877

# Upload key for pushing JARs to the asset server (dev/admin only — leave blank for non-devs)
upload.key=wyndFarmUpload2024

# Tab position: TOP or LEFT
display.tabSide=LEFT
